[workspace]
members = [
    "contracts/conditional-payment",
    "contracts/test-token",
    "services/attestation-agent",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
soroban-sdk = "28.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
stellar-xdr = "28"
stellar-rpc-client = "28"
stellar-strkey = "0.0.18"
ed25519-dalek = "2"
thiserror = "2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"